ore/change/after states. Preserve genuine synchronized narration/accessibility subtitles in their separate 2D layer; never use caption roles as an auxiliary-label escape. Use a recognizable object/reference across whole/local views; camera movement alone cannot explain a process. If the process is not yet scientifically established, do not invent a motion to make a sentence look true. Follow viewer-retention-design.md shot-relationship methods and return the event/time mapping for the editor. Use simulation only where its dynamics help the explanation; camera movement cannot substitute for promised process change. For characters, separately check skeleton, weights, retargeting, contact and facial curves; align speech to the current approved audio. Test the actual difficult action and the execution path's time evaluation/cache needs. Own the complete changed motion interval and both joins: verify opening and closing states, finite cutter coverage and final evaluated camera clearance before further lookdev. Send one bundled preview request with all known risk states and the complete affected native interval/joins under the parent's fixed repair scope and diagnostic allowance. Own the continuous result, not just corrected endpoints. On exhausted allowance, missed forecast or recurring defect family, stop new isolated-frame requests and return the shared cause/current implementation for the parent's bounded decision; do not rename the job to continue or drop the requested effect. Once the continuous sequence is ready, hand it to the edit for a playable candidate before another cosmetic pass. If a patch moves the defect elsewhere, use references/blender-execution.md's complete repair cycle to fix the shared representation while preserving the requested dynamic effect.

