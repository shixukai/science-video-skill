- **Safety & provenance:** Follow science-and-rights.md#original-visual-provenance-contract (self-created visuals or verified user capture; licensed 3D models allowed on 3D routes; zero third-party finished footage/stills). Under visual-system.md#handle-potentially-disturbing-imagery, never generate or accept peeled-skin, carved-window, glass-sleeved human flesh, or body-horror cutaways in video or covers; inspect Frame 0 and hero frames at full `1920×1080` resolution.
- **Visual craft & route specifics:**
  - *Google Flow / Realistic routes:* Read references/realistic-direction.md. Write physical shot cards before prompts, lock truth register and `time_scale`, keep scenes frameless (`>= 90%` safe zone) with blank unmarked props/instruments to prevent pseudo-text/PiP artifacts, generate text-free `2K` keyframes/cover art cleanly (`scripts/gemini_api_cli.py image` or Flow Web on `google_flow`), check `4–8 s` tails on raw contact sheets before `>= 1080p` lock, and repair AI-look defects at the source.
  - *Controlled 3D routes ONLY (when commissioned):* Read references/tool-routing.md, engineering-blender.md, animation-scene-design.md#non-text-visual-pointing-grammar-and-widescreen-aspect-ratio-framing, material-rendering.md, and spatial-typography.md. Uphold the Five Visual-First Laws (`high_poly_industrial_3d` / `high_poly_industrial_v1`): (1) check local/open-licensed high-poly glTF/CAD hosts FIRST (`CarConcept.glb`, Poly Haven CC0, real teardown references) and **NEVER substitute rectangular boxes or plain cylinders for curved/cast/sculpted hardware** (`>= 64`-segment hero curves, real `0.15–0.8 mm` machined chamfers & `1–3 mm` cast fillets, `WeightedNormal`/`EdgeSplit`, physical wall thickness, `0.15–0.5 mm` panel shadow gaps, applied `(1,1,1)` scale, authentic ISO fasteners/knurling/fittings, neural 3D strictly for organic/soft/matte props); (2) keep ONE bright, lived-in real-world environment and physical host continuously visible in depth of field across in-situ cutaways — **NEVER hide `env_root` or paste flat gray/black backdrop planes (`Stage_MacroBackdrop`)**; (3) frame causal mechanics in `28–60 mm` storytelling lenses keeping driver + mechanism + outcome + host anchor in frame (zero blind `> 75 mm` 2 cm corner slivers and zero `< 25%`-wide vertical "telephone-pole" dead zones); (4) enforce role-based color/finish coding (fixed vs. moving vs. working fluid, zero decorative floating glowing rings or mystery cubes) and zero legacy template reuse; (5) pass `scripts/colab_cli.py audit-blend --strict` across Frame 0 + body frames and render muted `1920×1080` Colab preflight stills passing a `< 1 s` muted silhouette & principle check BEFORE locking narration and beat-board verification (`scripts/build_visual_review.py beat-board`). Qualify critical assets first, enforce single-letter 3D spatial markers only, preserve real authored shaders/lighting (`purpose=appearance`), and keep multi-phase media distinct.
- **Claim fidelity & proportionate checks:** Apply science-and-rights.md#preserve-claim-meaning-through-production-handoffs and quality-acceptance.md#risk-based-rechecks-and-evidence-reuse. Match detail to the closest actual view without inventing engineering tolerances.

Preserve others' edits, route heavy renders through the producer, follow SKILL.md#local-review-links-and-bandwidth-conservation, and never self-certify independent visual approval.
